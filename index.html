<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>役職ガチャみぃ新宿ポス2026.11</title>
<style>
:root{--lime:#c7f36b;--lime-dark:#78ad22;--ink:#26321b;--paper:#fbfff3;--line:#d9e8bd}
*{box-sizing:border-box}
body{margin:0;background:linear-gradient(135deg,#f5ffe5,#eaffc8);color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;padding:24px 14px}
main{max-width:720px;margin:0 auto;background:#fff;border:2px solid var(--line);border-radius:24px;padding:clamp(18px,4vw,32px);box-shadow:0 12px 32px #557c2520}
.title-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
h1{font-size:clamp(21px,4.8vw,32px);line-height:1.3;margin:0}
.mode-toggle{flex:0 0 auto;background:#e5f5c9;color:#456d12;padding:8px 14px;font-size:13px;border:1.5px solid #a9ce68}
.mode-toggle.active{background:var(--lime);border-color:var(--lime-dark)}
.sub{color:#65754c;margin:0 0 24px;font-size:14px}
label{display:block;font-weight:750;margin:0 0 9px}
textarea{width:100%;min-height:110px;resize:vertical;border:2px solid var(--line);border-radius:14px;padding:14px;font:16px/1.6 inherit;color:var(--ink);outline:none}
textarea:focus{border-color:var(--lime-dark);box-shadow:0 0 0 3px #c7f36b55}
.hint{font-size:13px;color:#71805c;margin:8px 0 18px;line-height:1.6}
.ten-input-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.ten-input{min-height:90px}
[hidden]{display:none!important}
@media(max-width:560px){.ten-input-grid{grid-template-columns:1fr}}
.actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
button{border:0;border-radius:999px;padding:13px 22px;font-weight:800;font-size:15px;cursor:pointer}
button:active{transform:translateY(1px)}
.primary{background:var(--lime);color:#26321b;box-shadow:0 3px 0 #9cc94c}
.random{background:#fff;border:1.5px solid #a9ce68;color:#547d19;padding:9px 15px;font-size:13px}
.secondary{background:#f0f5e7;color:#52633a}
.status{min-height:22px;margin:12px 0 0;font-size:13px;color:#9a4a25}
.result-wrap{margin-top:24px;background:var(--paper);border:1.5px solid var(--line);border-radius:18px;padding:16px}
.result-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}
.result-head strong{font-size:15px}
.copy{background:#e5f5c9;color:#456d12;padding:9px 14px;font-size:13px}
#result{white-space:pre-wrap;overflow-wrap:anywhere;min-height:46px;font-size:20px;line-height:1.8;font-weight:750}
.empty{color:#91a17a;font-size:15px;font-weight:500}
.reference-wrap{margin-top:22px;border:1.5px solid var(--line);border-radius:18px;padding:16px;background:#fff}
.reference-wrap h2{font-size:19px;margin:0 0 4px}
.reference-hint{font-size:13px;color:#71805c;margin:0 0 14px}
.reference-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.reference-grid h3{font-size:14px;margin:0 0 8px;background:#eff9df;padding:9px 11px;border-radius:10px}
.reference-list{display:grid;grid-template-columns:1fr;gap:4px;max-height:420px;overflow:auto;padding-right:3px}
.reference-item{display:grid;grid-template-columns:30px 1fr;gap:7px;align-items:start;padding:5px 7px;border-bottom:1px solid #edf2e5;font-size:13px;line-height:1.45}
.reference-number{font-variant-numeric:tabular-nums;font-weight:800;color:#6b962b;text-align:right}
.reference-word{overflow-wrap:anywhere}
footer{font-size:12px;color:#82916a;text-align:center;margin-top:20px}
@media(max-width:560px){.reference-grid{grid-template-columns:1fr}.reference-list{max-height:340px}}
@media(max-width:480px){body{padding:12px 8px}main{border-radius:18px}.actions button{flex:0 0 auto}.primary{flex:1}}
</style>
</head>
<body>
<main>
  <div class="title-row">
    <h1>役職ガチャみぃ新宿ポス2026.11</h1>
    <button class="mode-toggle" id="modeToggle" type="button">10連</button>
  </div>
  <p class="sub">番号を入力して、みぃの役職を生成！</p>
  <div id="singleInputArea">
    <label for="numbers">番号を入力</label>
    <textarea id="numbers" placeholder="例：38 39 → 77&#10;22 45&#10;44　50"></textarea>
    <p class="hint">各行の「形容詞番号 名詞番号」を読み取ります。矢印以降の合計数字は無視します。複数行まとめて入力できます。</p>
  </div>
  <div id="tenInputArea" hidden>
    <div class="ten-input-grid">
      <div>
        <label for="adjectiveNumbers">形容詞（10個）</label>
        <textarea id="adjectiveNumbers" class="ten-input" placeholder="例：13 5 12 16 5 43 21 22 12 32 → 181"></textarea>
      </div>
      <div>
        <label for="nounNumbers">名詞（10個）</label>
        <textarea id="nounNumbers" class="ten-input" placeholder="例：13 5 12 16 5 43 21 22 12 32 → 181"></textarea>
      </div>
    </div>
    <p class="hint">それぞれのフォームに番号を10個入力します。矢印（→）以降の合計値は判定せず、左から順番に組み合わせます。</p>
  </div>
  <div class="actions">
    <button class="primary" id="generate">生成</button>
    <button class="random" id="random">ランダム</button>
    <button class="secondary" id="clear">クリア</button>
  </div>
  <p class="status" id="status" aria-live="polite"></p>
  <section class="result-wrap">
    <div class="result-head"><strong>生成結果</strong><button class="copy" id="copy">まとめてコピー</button></div>
    <div id="result" class="empty">ここに結果が表示されます</div>
  </section>
  <section class="reference-wrap">
    <h2>番号早見表</h2>
    <p class="reference-hint">番号から形容詞・名詞を確認できます。</p>
    <div class="reference-grid">
      <div>
        <h3>形容詞（1〜50）</h3>
        <div id="adjectiveTable" class="reference-list"></div>
      </div>
      <div>
        <h3>名詞（1〜50）</h3>
        <div id="nounTable" class="reference-list"></div>
      </div>
    </div>
  </section>
  <footer>形容詞と名詞の番号を組み合わせて生成します</footer>
</main>
<script>
const adjectives = [
"猛者な","おもしろい","最推しの","古参の","優しい","大好きな","元気な","全肯定の","完璧な","尊い",
"上品な","気持ちいい","元気な","最強な","大好きな","メロい","一生","かわちぃ","美しい","珍しい",
"おいちぃ","まずい","大盛りな","大食いな","高カロリーな","あまやかし","神がかった","名高い","あっつい！","ごほうび",
"お気に入りの","お気に入りだった","ちょろい","○○な","気持ちいい","長時間","短時間","New!","過去の","未来の",
"おれも♡","おまえも♡","ありよりのありな","しぬほど","やかましい","堀○輔な","バケモンな","エッドい","せこい","くさい"
];
const nouns = [
"#猛者の鑑","#もさとも","#もさぴっぴ","もっさもさ!","くるぶし","推し","癒し","姫or王子","元カノor元カレ","彼女or彼氏",
"嫁or旦那","婚約者","姉or兄","妹or弟","親友","相方","陰キャ","陽キャ","に勝った男or女","役職王",
"ダイス王","お守り","ぬいぐるみ","ペット","ﾜﾝ!ﾜﾝ!ﾜﾝ!","ﾆｬﾝ!ﾆｬﾝ!ﾆｬﾝ!","ｱｲｽｸﾘｰﾑ","そうめん","ﾎﾟﾃﾁの残り1枚","ﾍﾟﾛﾍﾟﾛｷｬﾝﾃﾞｨ-",
"ｼｮｰﾄｽﾘｰﾊﾟｰ","ﾏｲｸﾛｽﾘｰﾊﾟｰ","アラーム","布団","看護師","整体師","捕食者","ヲタク","ごま","おかず",
"社畜","パシリ","しもべ","下僕","奴隷","むっつりｽｹﾍﾞ","血豆","×××","う○こ","ゴミ箱"
];
const input=document.getElementById('numbers');
const adjectiveInput=document.getElementById('adjectiveNumbers');
const nounInput=document.getElementById('nounNumbers');
const singleInputArea=document.getElementById('singleInputArea');
const tenInputArea=document.getElementById('tenInputArea');
const result=document.getElementById('result');
const status=document.getElementById('status');
const modeToggle=document.getElementById('modeToggle');
const inputHint=document.getElementById('inputHint');
let tenMode=false;
function show(items){
  result.textContent=items.map(([a,n])=>`みぃの${adjectives[a-1]}${nouns[n-1]}`).join('\n');
  result.classList.toggle('empty',items.length===0);
}
function numbersBeforeArrow(line){
  const beforeArrow=line.split(/→|➜|⇒/)[0];
  return beforeArrow.match(/\d+/g)||[];
}
function generate(){
  if(tenMode){
    const adjectiveNumbers=numbersBeforeArrow(adjectiveInput.value).map(Number);
    const nounNumbers=numbersBeforeArrow(nounInput.value).map(Number);
    if(adjectiveNumbers.length!==10||nounNumbers.length!==10){
      status.textContent=`形容詞・名詞のフォームに、それぞれ番号を10個入力してください。（現在：形容詞${adjectiveNumbers.length}個／名詞${nounNumbers.length}個）`;return;
    }
    const invalidIndex=adjectiveNumbers.findIndex((value,index)=>value<1||value>50||nounNumbers[index]<1||nounNumbers[index]>50);
    if(invalidIndex!==-1){
      status.textContent=`${invalidIndex+1}番目の番号：1〜50で指定してください。`;return;
    }
    const pairs=adjectiveNumbers.map((value,index)=>[value,nounNumbers[index]]);
    show(pairs);status.textContent='10個の役職を生成しました。';return;
  }
  const lines=input.value.split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const pairs=[];
  for(let i=0;i<lines.length;i++){
    const nums=numbersBeforeArrow(lines[i]);
    if(nums.length<2){status.textContent=`${i+1}行目：番号を2つ入力してください。`;return;}
    const a=Number(nums[0]),n=Number(nums[1]);
    if(a<1||a>50||n<1||n>50){status.textContent=`${i+1}行目：番号はそれぞれ1〜50で指定してください。`;return;}
    pairs.push([a,n]);
  }
  if(!pairs.length){status.textContent='番号を入力してください。';return;}
  show(pairs);status.textContent=`${pairs.length}件生成しました。`;
}
function renderReferenceTable(targetId, words){
  document.getElementById(targetId).innerHTML = words.map((word,index)=>
    `<div class="reference-item"><span class="reference-number">${index+1}</span><span class="reference-word">${word.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')}</span></div>`
  ).join('');
}
renderReferenceTable('adjectiveTable', adjectives);
renderReferenceTable('nounTable', nouns);

modeToggle.addEventListener('click',()=>{
  tenMode=!tenMode;
  modeToggle.textContent=tenMode?'単発':'10連';
  modeToggle.classList.toggle('active',tenMode);
  input.value='';
  adjectiveInput.value='';
  nounInput.value='';
  singleInputArea.hidden=tenMode;
  tenInputArea.hidden=!tenMode;
  result.textContent='ここに結果が表示されます';
  result.classList.add('empty');
  status.textContent='';
  document.getElementById('copy').textContent=tenMode?'10個まとめてコピー':'まとめてコピー';
});
document.getElementById('generate').addEventListener('click',generate);
document.getElementById('random').addEventListener('click',()=>{
  if(tenMode){
    const adjectivePicks=Array.from({length:10},()=>Math.floor(Math.random()*50)+1);
    const nounPicks=Array.from({length:10},()=>Math.floor(Math.random()*50)+1);
    adjectiveInput.value=adjectivePicks.join(' ')+' → '+adjectivePicks.reduce((sum,value)=>sum+value,0);
    nounInput.value=nounPicks.join(' ')+' → '+nounPicks.reduce((sum,value)=>sum+value,0);
    show(adjectivePicks.map((value,index)=>[value,nounPicks[index]]));
    status.textContent='ランダムで10個の役職を抽選しました。';
  }else{
    const a=Math.floor(Math.random()*50)+1,n=Math.floor(Math.random()*50)+1;
    input.value=`${a} ${n}`;
    show([[a,n]]);status.textContent='ランダムで1件抽選しました。';
  }
});
document.getElementById('clear').addEventListener('click',()=>{
  input.value='';adjectiveInput.value='';nounInput.value='';result.textContent='ここに結果が表示されます';result.classList.add('empty');status.textContent='';
});
document.getElementById('copy').addEventListener('click',async()=>{
  const text=result.classList.contains('empty')?'':result.textContent;
  if(!text){status.textContent='コピーする結果がありません。';return;}
  try{await navigator.clipboard.writeText(text);status.textContent='生成結果をコピーしました。';}
  catch(e){status.textContent='コピーできませんでした。結果を選択してコピーしてください。';}
});
</script>
</body>
</html>
